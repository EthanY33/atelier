name: atelier audits
description: Run atelier's accessibility and runtime-UX audits on a page or built HTML file and fail on critical or serious findings.
author: Ethan Yucetepe
branding:
  icon: check-square
  color: orange

inputs:
  target:
    description: URL, file:// URL or path to an HTML file (relative to the workspace).
    required: true
  audits:
    description: Comma-separated audits to run. Any of a11y, ux.
    default: a11y,ux
  dynamic:
    description: Also run runtime-ux-audit's dynamic pass in Chromium (slower).
    default: 'false'
  brand:
    description: Path to a brand.json whose targets and motion sections set the budgets.
    default: ''
  out:
    description: Directory for the reports.
    default: atelier-reports

outputs:
  report-dir:
    description: Directory holding a11y-report.md, ux-report.md and their raw JSON.
    value: ${{ inputs.out }}

runs:
  using: composite
  steps:
    # setup-node prepends to PATH for the rest of the caller's job, so only
    # run it when the job's Node is missing or older than 22. A caller on
    # Node 24 keeps Node 24 for the steps after this action.
    - name: Check Node
      id: node
      shell: bash
      run: |
        major="$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)"
        if [ "$major" -ge 22 ]; then
          echo "Using the job's Node $(node -v)."
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.node.outputs.ok != 'true'
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        package-manager-cache: false

    - name: Install atelier
      shell: bash
      run: |
        npm ci --prefix "$GITHUB_ACTION_PATH/plugins/atelier" --no-audit --no-fund
        npm exec --prefix "$GITHUB_ACTION_PATH/plugins/atelier" -- playwright install --with-deps chromium

    - name: Run audits
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        AUDITS: ${{ inputs.audits }}
        DYNAMIC: ${{ inputs.dynamic }}
        BRAND: ${{ inputs.brand }}
        OUT: ${{ inputs.out }}
      run: |
        set -u
        cli="$GITHUB_ACTION_PATH/plugins/atelier/bin/atelier"
        status=0
        IFS=',' read -ra list <<< "$AUDITS"
        for audit in "${list[@]}"; do
          audit="$(echo "$audit" | tr -d '[:space:]')"
          case "$audit" in
            a11y)
              node "$cli" a11y "$TARGET" --out "$OUT/a11y" || status=$(( $? > status ? $? : status )) ;;
            ux)
              args=("$TARGET" --out "$OUT/ux")
              [ "$DYNAMIC" = "true" ] && args+=(--dynamic)
              [ -n "$BRAND" ] && args+=(--brand "$BRAND")
              node "$cli" ux "${args[@]}" || status=$(( $? > status ? $? : status )) ;;
            "") ;;
            *) echo "Unknown audit: $audit (expected a11y or ux)"; exit 2 ;;
          esac
        done
        for f in "$OUT"/*/*-report.md; do
          [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"
        done
        exit "$status"
