<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- The card never needs the network or page scripts. Brand fonts arrive as data: URIs. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; font-src data:; img-src data:" />
  <meta name="viewport" content="width=1200" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 32px;
      padding: 72px;
      background: var(--bg, #111111);
      color: var(--fg, #ffffff);
      font-family: var(--font-body, system-ui), system-ui, sans-serif;
    }
    /* The content block absorbs overflow so the footer always stays on the canvas. */
    .content {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }
    .title {
      font-family: var(--font-display, var(--font-body, system-ui)), system-ui, sans-serif;
      font-size: 88px;
      font-weight: 700;
      line-height: 1.05;
      max-width: 900px;
      overflow-wrap: anywhere;
    }
    .subtitle {
      font-size: 36px;
      line-height: 1.2;
      opacity: 0.7;
      margin-top: 24px;
      max-width: 900px;
      overflow-wrap: anywhere;
    }
    .subtitle:empty { display: none; }
    .footer {
      display: flex;
      justify-content: space-between;
      gap: 32px;
      flex-shrink: 0;
      font-size: 24px;
      line-height: 1.3;
      opacity: 0.8;
      white-space: nowrap;
    }
    .footer span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
  {{style}}
</head>
<body>
  <div class="content" id="content">
    <div class="title" id="title">{{title}}</div>
    <div class="subtitle" id="subtitle">{{subtitle}}</div>
  </div>
  <div class="footer" id="footer">
    <span id="studio">{{studio}}</span>
    <span id="slug">{{slug}}</span>
  </div>
</body>
</html>
