name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install dependencies
        run: npm ci

      # Uses the plugin's pinned Playwright so the browser build matches.
      - name: Install Playwright Chromium
        run: npm run setup:browsers -- --with-deps

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: runner.os == 'Linux' && matrix.node == '22'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  validate:
    name: Validate schemas and manifests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JSON schemas and manifests
        run: npm run lint:schemas

      - name: Version strings agree
        run: npm run check:versions

      - name: Claude Code plugin validate
        run: npx --yes @anthropic-ai/claude-code plugin validate .

  plugin-install:
    name: Installed-plugin smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Mirrors what Claude Code does on /plugin install: copy plugins/atelier
      # out of the repo, then `npm ci --ignore-scripts` inside the copy with a
      # 60 second budget. Nothing from the repo root is visible to the copy.
      - name: Simulate marketplace install and smoke-test every skill
        run: node scripts/smoke-installed-plugin.mjs

  action:
    name: GitHub Action self-test (caller on Node ${{ matrix.caller-node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older than 22: the action installs Node 22, which stays on PATH.
          - caller-node: '20'
            expect-node: '22'
          # 22 or newer: the action uses the job's Node and leaves it alone.
          - caller-node: '24'
            expect-node: '24'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.caller-node }}

      - name: Run the composite action against the bundled example page
        uses: ./
        with:
          target: plugins/atelier/examples/page.html
          out: action-reports

      - name: Reports were written
        run: |
          test -s action-reports/a11y/a11y-report.md
          test -s action-reports/ux/ux-report.md
          test -s action-reports/ux/ux-raw.json

      - name: Job's Node after the action
        env:
          EXPECT: ${{ matrix.expect-node }}
        run: |
          major="$(node -p 'process.versions.node.split(".")[0]')"
          echo "node $(node -v) after the action; expected major $EXPECT"
          test "$major" = "$EXPECT"
