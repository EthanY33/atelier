name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Tag matches every version string
        run: npm run check:versions -- --tag "${GITHUB_REF_NAME}"

      - name: Extract release notes from CHANGELOG
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Create release (skipped when it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; leaving it as is."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "atelier ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --verify-tag
          fi
