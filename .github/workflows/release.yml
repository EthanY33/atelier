name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  checks: read

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Tag matches every version string
        run: npm run check:versions -- --tag "${GITHUB_REF_NAME}"

      # Only a commit already on main whose CI passed may be released. The tag
      # alone proves neither: check:versions passes on a release branch tip.
      - name: Tag is on main and CI is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          node scripts/release-gate.mjs ancestry "$GITHUB_SHA" origin/main
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" --paginate \
            --jq '.check_runs[]' > check-runs.ndjson
          node scripts/release-gate.mjs checks check-runs.ndjson --ignore "Publish GitHub release"

      - name: Extract release notes from CHANGELOG
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Create release (skipped when it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; leaving it as is."
          else
            # --prerelease for an rc, --latest=false for a backport (scripts/release-flags.mjs)
            flags="$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||' \
              | node scripts/release-flags.mjs "${GITHUB_REF_NAME}")"
            gh release create "${GITHUB_REF_NAME}" \
              --title "atelier ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --verify-tag $flags
          fi

      # `uses: EthanY33/atelier@v1` resolves through a floating major tag.
      # Point it at this commit when this is the newest stable release of its
      # major, so a backported patch never moves it backwards. HEAD is the
      # peeled commit, so this works for lightweight and annotated tags alike.
      - name: Move the major tag (stable releases only)
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          newest="$(git ls-remote --tags --refs origin \
            | sed 's|.*refs/tags/||' \
            | grep -E "^${major}\.[0-9]+\.[0-9]+$" \
            | sort -V | tail -n 1)"
          if [ "$newest" != "$GITHUB_REF_NAME" ]; then
            echo "${GITHUB_REF_NAME} is not the newest ${major} release (${newest}); leaving ${major} as is."
            exit 0
          fi
          git tag -f "$major" "$(git rev-parse HEAD)"
          git push -f origin "refs/tags/$major"
